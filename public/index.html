<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Online Chat Room</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058R+I7gJ8y5g5z5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <!-- I manually set the height of the caht history window here-->
    <style>
      #messages {
        height: 300px;
      }
    </style>
  </head>
  <body>
    <h1>ONLINE CHAT ROOM</h1>
    <!-- This acive users count dynamically gets changed based of of the id-->
    <h2 id="active-users">Active Users: 0</h2>
    <p class="ttl-note">Messages are automatically deleted every 24 hours</p>
    <div class="container">
      <div class="row">
        <div class="col-md-6 offset-md-3 col-sm-12">
          <div id="status"></div>
          <div id="chat">
            <br />
            <div class="card">
              <div class="chat-header">Chat Log</div>
              <!-- This is where the actual chat window is-->
              <div class="chat-window">
                <ul class="message-list" id="messages"></ul>
              </div>
              <!-- Basically I use the id here to get the username-->
              <div class="chat-input">
                <input
                  type="value"
                  required=""
                  id="username"
                  maxlength="32"
                  placeholder="Type your username here"
                />
              </div>
              <!-- Message input and send button in same flex container -->
              <div class="chat-input">
                <input
                  type="text"
                  id="textarea"
                  class="message-input"
                  maxlength="500"
                  placeholder="Type your message here"
                />
                <button class="arrow" id="send" aria-label="Send">
                  <span class="arrow-top"></span>
                  <span class="arrow-bottom"></span>
                </button>
              </div>
            </div>
            <br />
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      // Firebase Realtime Database replaces the old Node/Socket.IO server
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        set,
        query,
        orderByChild,
        startAt,
        limitToLast,
        onChildAdded,
        onChildRemoved,
        onValue,
        onDisconnect,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
      import { firebaseConfig } from "./firebase-config.js";

      // function to get ellme nts by id
      var element = function (id) {
        return document.getElementById(id);
      };

      // Get all Elements by id
      var status = element("status");
      var messages = element("messages");
      var textarea = element("textarea");
      var username = element("username");
      var sendBtn = element("send");

      // Set default status
      var statusDefault = status.textContent;

      var setStatus = function (s) {
        // Set status
        status.textContent = s;
        if (s !== statusDefault) {
          setTimeout(function () {
            setStatus(statusDefault);
          }, 4000);
        }
      };

      // connects to the database
      var db = getDatabase(initializeApp(firebaseConfig));
      var messagesRef = ref(db, "messages");

      // Each open tab adds itself to "presence", and Firebase removes it when the tab closes
      var presenceRef = push(ref(db, "presence"));
      onValue(ref(db, ".info/connected"), function (snap) {
        if (snap.val() === true) {
          onDisconnect(presenceRef).remove();
          set(presenceRef, true);
        }
      });

      // updates active users whenever someone joins or leaves
      onValue(ref(db, "presence"), function (snap) {
        element("active-users").textContent = `Active Users: ${snap.size}`;
      });

      // Display the latest 100 messages from the last 24 hours, then new ones as they arrive.
      // The 24 hour cutoff is a backup in case the daily clear-chat Action doesn't run
      var cutoff = Date.now() - 24 * 60 * 60 * 1000;
      var recent = query(messagesRef, orderByChild("createdAt"), startAt(cutoff), limitToLast(100));

      onChildAdded(recent, function (snap) {
        var data = snap.val();
        // Build out message div
        var message = document.createElement("div");
        message.setAttribute("class", "chat-message");
        message.id = "msg-" + snap.key;
        message.textContent = data.name + ": " + data.message;
        messages.insertBefore(message, messages.firstChild);
      });

      // When the daily clear runs (or a message ages out), remove it from the screen
      onChildRemoved(recent, function (snap) {
        var message = element("msg-" + snap.key);
        if (message) message.remove();
      });

      // Validate and save a message, everyone listening sees it instantly
      var sendMessage = function () {
        var name = username.value.trim();
        var text = textarea.value.trim();

        if (name == "" || text == "") {
          setStatus("Please enter a name and message");
          return;
        }

        push(messagesRef, { name: name, message: text, createdAt: serverTimestamp() })
          .then(function () {
            // Clear textarea after sending
            textarea.value = "";
          })
          .catch(function (err) {
            console.error("Failed to send message:", err);
            setStatus("Message failed to send");
          });
      };

      // Function to "send" when enter key is pressed
      textarea.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          sendMessage();
          event.preventDefault();
        }
      });

      // Function to "send" when button is clicked
      sendBtn.addEventListener("click", sendMessage);
    </script>
  </body>
</html>
